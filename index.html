<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>干支暦</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#14203A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="干支暦">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#2B2118;
    --paper:#FBF6EA;
    --indigo:#14203A;
    --indigo-2:#1E2E52;
    --gold:#B08D57;
    --vermillion:#C1272D;
    --sub:#7A7263;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--indigo);
    background-image:
      radial-gradient(circle at 15% 10%, rgba(176,141,87,0.10), transparent 40%),
      radial-gradient(circle at 85% 90%, rgba(176,141,87,0.08), transparent 40%);
    font-family:'Zen Kaku Gothic New', sans-serif;
    color:var(--paper);
    min-height:100vh;
    padding:20px 14px 40px;
  }
  .wrap{max-width:520px;margin:0 auto;}

  header{
    text-align:center;
    margin-bottom:18px;
    padding-top:6px;
  }
  .eyebrow{
    font-size:11px;
    letter-spacing:0.35em;
    color:var(--gold);
    margin-bottom:6px;
  }
  h1{
    font-family:'Noto Serif JP', serif;
    font-weight:700;
    font-size:26px;
    margin:0;
    letter-spacing:0.08em;
  }

  .nav{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin:22px 0 14px;
  }
  .nav button{
    background:none;
    border:1px solid rgba(251,246,234,0.35);
    color:var(--paper);
    width:38px;height:38px;
    border-radius:50%;
    font-size:16px;
    cursor:pointer;
    transition:background .15s;
  }
  .nav button:hover{background:rgba(251,246,234,0.12);}
  .nav .month-label{
    font-family:'Noto Serif JP', serif;
    font-size:19px;
    letter-spacing:0.05em;
  }
  .nav .month-label span{color:var(--gold); font-size:14px; margin-left:4px;}

  .card{
    background:var(--paper);
    color:var(--ink);
    border-radius:6px;
    padding:16px 12px 20px;
    box-shadow:0 18px 40px rgba(0,0,0,0.35);
  }

  .dow{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    text-align:center;
    font-size:11px;
    color:var(--sub);
    letter-spacing:0.1em;
    margin-bottom:6px;
  }
  .dow div{padding:4px 0;}

  .grid{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    gap:4px;
  }
  .cell{
    position:relative;
    aspect-ratio:1/1.18;
    border-radius:4px;
    padding:5px 3px 4px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-start;
    background:rgba(43,33,24,0.02);
  }
  .cell.empty{background:none;}
  .cell .num{
    font-family:'Noto Serif JP', serif;
    font-size:15px;
    font-weight:600;
    line-height:1;
  }
  .cell .kanshi{
    font-family:'Noto Serif JP', serif;
    font-size:12px;
    color:var(--sub);
    margin-top:5px;
    letter-spacing:0.03em;
  }
  .cell.sun .num{color:#a8433c;}
  .cell.sat .num{color:#3d5a80;}

  .cell.today{
    background:rgba(193,39,45,0.06);
  }
  .cell.today .stamp{
    position:absolute;
    top:1px; right:1px;
    width:20px; height:20px;
    border:1.4px solid var(--vermillion);
    border-radius:3px;
    transform:rotate(6deg);
    display:flex;
    align-items:center;
    justify-content:center;
    opacity:0.9;
  }
  .cell.today .stamp::after{
    content:"今";
    font-family:'Noto Serif JP', serif;
    font-size:11px;
    color:var(--vermillion);
    font-weight:700;
  }
  .cell.today .num{color:var(--vermillion);}
  .cell.today .kanshi{color:var(--vermillion); font-weight:600;}

  .legend{
    margin-top:16px;
    display:flex;
    gap:14px;
    justify-content:center;
    font-size:11px;
    color:rgba(251,246,234,0.55);
    letter-spacing:0.04em;
  }

  .detail{
    margin-top:16px;
    background:rgba(251,246,234,0.06);
    border:1px solid rgba(251,246,234,0.15);
    border-radius:6px;
    padding:14px 14px 12px;
  }
  .pillars{
    display:flex;
    justify-content:center;
    gap:8px;
  }
  .pillar{
    flex:1;
    max-width:120px;
    text-align:center;
    padding:8px 4px;
    border-radius:5px;
    background:rgba(251,246,234,0.04);
  }
  .pillar.main{
    background:rgba(193,39,45,0.10);
    border:1px solid rgba(193,39,45,0.35);
  }
  .plabel{font-size:10px; color:var(--gold); letter-spacing:0.2em; margin-bottom:4px;}
  .pvalue{font-family:'Noto Serif JP', serif; font-size:21px; letter-spacing:0.08em;}
  .pillar.main .pvalue{color:var(--vermillion);}
  .note{
    margin-top:10px;
    font-size:10px;
    line-height:1.5;
    color:rgba(251,246,234,0.4);
    text-align:center;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">六十干支 早見</div>
    <h1>干支暦</h1>
  </header>

  <div class="nav">
    <button id="prev">‹</button>
    <div class="month-label"><span id="ym"></span></div>
    <button id="next">›</button>
  </div>

  <div class="card">
    <div class="dow">
      <div>日</div><div>月</div><div>火</div><div>水</div><div>木</div><div>金</div><div>土</div>
    </div>
    <div class="grid" id="grid"></div>
  </div>

  <div class="detail" id="todayDetail"></div>

  <div class="legend">
    <span>十干：甲乙丙丁戊己庚辛壬癸</span>
    <span>十二支：子丑寅卯辰巳午未申酉戌亥</span>
  </div>
</div>

<script>
const STEMS = ['甲','乙','丙','丁','戊','己','庚','辛','壬','癸'];
const BRANCHES = ['子','丑','寅','卯','辰','巳','午','未','申','酉','戌','亥'];

// 基準日: 2026-08-03 は 己酉(60干支中インデックス45, 甲子=0起点)
const REF_UTC = Date.UTC(2026, 7, 3); // month is 0-indexed
const REF_INDEX = 45;

function kanshiIndex(y, m, d){
  const t = Date.UTC(y, m, d);
  const diffDays = Math.round((t - REF_UTC) / 86400000);
  let idx = (REF_INDEX + diffDays) % 60;
  if (idx < 0) idx += 60;
  return idx;
}
function kanshiStr(y, m, d){
  const idx = kanshiIndex(y, m, d);
  return STEMS[idx % 10] + BRANCHES[idx % 12];
}

// ---- 年干支・月干支 ----
// 暦上の「年」は立春(2/4頃)で切り替わる。月は1日ではなく節気(下記12個)で切り替わる。
// 節気の日付は年によって±1日ずれることがあるため、ここでは代表的な日付で近似しています。
const SEKKI = [
  {m:2, d:4},  // 立春 -> 寅月開始
  {m:3, d:6},  // 啓蟄 -> 卯月
  {m:4, d:5},  // 清明 -> 辰月
  {m:5, d:6},  // 立夏 -> 巳月
  {m:6, d:6},  // 芒種 -> 午月
  {m:7, d:7},  // 小暑 -> 未月
  {m:8, d:8},  // 立秋 -> 申月
  {m:9, d:8},  // 白露 -> 酉月
  {m:10, d:8}, // 寒露 -> 戌月
  {m:11, d:7}, // 立冬 -> 亥月
  {m:12, d:7}, // 大雪 -> 子月
  {m:1, d:6}   // 小寒 -> 丑月(暦の年としては前年扱い)
];

function effYear(y, m0, d){
  // m0は0始まりの月。立春(2/4)より前なら、暦上はまだ前年。
  const risshun = new Date(y, 1, 4);
  const target = new Date(y, m0, d);
  return target < risshun ? y - 1 : y;
}

function yearIndex60(y, m0, d){
  const ey = effYear(y, m0, d);
  let idx = (ey - 4) % 60;
  if (idx < 0) idx += 60;
  return idx;
}

function monthSlotIndex(y, m0, d){
  // 0=寅月(立春〜) ... 11=丑月(小寒〜立春前)
  const ey = effYear(y, m0, d);
  const target = new Date(y, m0, d);
  const bounds = SEKKI.map((s, i) => {
    const yy = (i === 11) ? ey + 1 : ey; // 小寒は暦上の翌年カレンダー月
    return { idx: i, date: new Date(yy, s.m - 1, s.d) };
  });
  let chosen = bounds[0];
  for (const b of bounds) { if (b.date <= target) chosen = b; }
  return chosen.idx;
}

function yearKanshiStr(y, m0, d){
  const idx = yearIndex60(y, m0, d);
  return STEMS[idx % 10] + BRANCHES[idx % 12];
}

function monthKanshiStr(y, m0, d){
  const yIdx = yearIndex60(y, m0, d);
  const yearStem = yIdx % 10;
  const startStem = (2 * (yearStem % 5) + 2) % 10; // 五虎遁の法(寅月の干)
  const slot = monthSlotIndex(y, m0, d); // 0=寅...11=丑
  const stem = (startStem + slot) % 10;
  const branch = (2 + slot) % 12; // 寅=2
  return STEMS[stem] + BRANCHES[branch];
}

const today = new Date();
let viewY = today.getFullYear();
let viewM = today.getMonth();

function render(){
  document.getElementById('ym').innerHTML =
    viewY + '年 ' + (viewM+1) + '月 <span>Reiwa</span>';

  const grid = document.getElementById('grid');
  grid.innerHTML = '';

  const firstDow = new Date(viewY, viewM, 1).getDay();
  const daysInMonth = new Date(viewY, viewM+1, 0).getDate();

  for(let i=0;i<firstDow;i++){
    const c = document.createElement('div');
    c.className = 'cell empty';
    grid.appendChild(c);
  }

  for(let d=1; d<=daysInMonth; d++){
    const dow = new Date(viewY, viewM, d).getDay();
    const c = document.createElement('div');
    c.className = 'cell' + (dow===0?' sun':'') + (dow===6?' sat':'');
    const isToday = (viewY===today.getFullYear() && viewM===today.getMonth() && d===today.getDate());
    if(isToday) c.className += ' today';

    const num = document.createElement('div');
    num.className = 'num';
    num.textContent = d;

    const ks = document.createElement('div');
    ks.className = 'kanshi';
    ks.textContent = kanshiStr(viewY, viewM, d);

    c.appendChild(num);
    c.appendChild(ks);
    if(isToday){
      const stamp = document.createElement('div');
      stamp.className = 'stamp';
      c.appendChild(stamp);
    }
    grid.appendChild(c);
  }

  const detail = document.getElementById('todayDetail');
  const ty = today.getFullYear(), tm = today.getMonth(), td = today.getDate();
  const idx = kanshiIndex(ty, tm, td);
  detail.innerHTML =
    '<div class="pillars">' +
      '<div class="pillar"><div class="plabel">年柱</div><div class="pvalue">' + yearKanshiStr(ty, tm, td) + '</div></div>' +
      '<div class="pillar"><div class="plabel">月柱</div><div class="pvalue">' + monthKanshiStr(ty, tm, td) + '</div></div>' +
      '<div class="pillar main"><div class="plabel">日柱</div><div class="pvalue">' + kanshiStr(ty, tm, td) + '</div></div>' +
    '</div>' +
    '<div class="note">日柱は60干支中 第' + (idx+1) + '番　※月柱・年柱の節切り日は年により前後1日ずれる場合があります</div>';
}

document.getElementById('prev').onclick = ()=>{
  viewM--; if(viewM<0){viewM=11; viewY--;}
  render();
};
document.getElementById('next').onclick = ()=>{
  viewM++; if(viewM>11){viewM=0; viewY++;}
  render();
};

render();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}
</script>
</body>
</html>
