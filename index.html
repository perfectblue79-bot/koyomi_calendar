<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>干支暦</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#14203A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="干支暦">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#2B2118;
    --paper:#FBF6EA;
    --indigo:#14203A;
    --indigo-2:#1E2E52;
    --gold:#B08D57;
    --vermillion:#C1272D;
    --sub:#7A7263;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--indigo);
    background-image:
      radial-gradient(circle at 15% 10%, rgba(176,141,87,0.10), transparent 40%),
      radial-gradient(circle at 85% 90%, rgba(176,141,87,0.08), transparent 40%);
    font-family:'Zen Kaku Gothic New', sans-serif;
    color:var(--paper);
    min-height:100vh;
    padding:20px 14px 40px;
  }
  .wrap{max-width:520px;margin:0 auto;}

  header{
    text-align:center;
    margin-bottom:18px;
    padding-top:6px;
  }
  .eyebrow{
    font-size:11px;
    letter-spacing:0.35em;
    color:var(--gold);
    margin-bottom:6px;
  }
  h1{
    font-family:'Noto Serif JP', serif;
    font-weight:700;
    font-size:26px;
    margin:0;
    letter-spacing:0.08em;
  }

  .nav{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin:22px 0 14px;
  }
  .nav button{
    background:none;
    border:1px solid rgba(251,246,234,0.35);
    color:var(--paper);
    width:38px;height:38px;
    border-radius:50%;
    font-size:16px;
    cursor:pointer;
    transition:background .15s;
  }
  .nav button:hover{background:rgba(251,246,234,0.12);}
  .nav .month-label{
    font-family:'Noto Serif JP', serif;
    font-size:19px;
    letter-spacing:0.05em;
  }
  .nav .month-label span{color:var(--gold); font-size:14px; margin-left:4px;}

  .card{
    background:var(--paper);
    color:var(--ink);
    border-radius:6px;
    padding:16px 12px 20px;
    box-shadow:0 18px 40px rgba(0,0,0,0.35);
  }

  .dow{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    text-align:center;
    font-size:11px;
    color:var(--sub);
    letter-spacing:0.1em;
    margin-bottom:6px;
  }
  .dow div{padding:4px 0;}

  .grid{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    gap:4px;
  }
  .cell{
    position:relative;
    aspect-ratio:1/1.18;
    border-radius:4px;
    padding:5px 3px 4px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-start;
    background:rgba(43,33,24,0.02);
  }
  .cell.empty{background:none;}
  .cell .num{
    font-family:'Noto Serif JP', serif;
    font-size:15px;
    font-weight:600;
    line-height:1;
  }
  .cell .kanshi{
    font-family:'Noto Serif JP', serif;
    font-size:12px;
    color:var(--sub);
    margin-top:5px;
    letter-spacing:0.03em;
  }
  .cell.sun .num{color:#a8433c;}
  .cell.sat .num{color:#3d5a80;}

  .cell.today{
    background:rgba(193,39,45,0.06);
  }
  .cell.today .stamp{
    position:absolute;
    top:1px; right:1px;
    width:20px; height:20px;
    border:1.4px solid var(--vermillion);
    border-radius:3px;
    transform:rotate(6deg);
    display:flex;
    align-items:center;
    justify-content:center;
    opacity:0.9;
  }
  .cell.today .stamp::after{
    content:"今";
    font-family:'Noto Serif JP', serif;
    font-size:11px;
    color:var(--vermillion);
    font-weight:700;
  }
  .cell.today .num{color:var(--vermillion);}
  .cell.today .kanshi{color:var(--vermillion); font-weight:600;}

  .legend{
    margin-top:16px;
    display:flex;
    gap:14px;
    justify-content:center;
    font-size:11px;
    color:rgba(251,246,234,0.55);
    letter-spacing:0.04em;
  }

  .detail{
    margin-top:16px;
    background:rgba(251,246,234,0.06);
    border:1px solid rgba(251,246,234,0.15);
    border-radius:6px;
    padding:14px 16px;
    text-align:center;
  }
  .detail .label{font-size:11px; color:var(--gold); letter-spacing:0.15em; margin-bottom:4px;}
  .detail .value{font-family:'Noto Serif JP', serif; font-size:22px; letter-spacing:0.1em;}
  .detail .value span{font-size:13px; color:rgba(251,246,234,0.55); margin-left:6px;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">六十干支 早見</div>
    <h1>干支暦</h1>
  </header>

  <div class="nav">
    <button id="prev">‹</button>
    <div class="month-label"><span id="ym"></span></div>
    <button id="next">›</button>
  </div>

  <div class="card">
    <div class="dow">
      <div>日</div><div>月</div><div>火</div><div>水</div><div>木</div><div>金</div><div>土</div>
    </div>
    <div class="grid" id="grid"></div>
  </div>

  <div class="detail" id="todayDetail"></div>

  <div class="legend">
    <span>十干：甲乙丙丁戊己庚辛壬癸</span>
    <span>十二支：子丑寅卯辰巳午未申酉戌亥</span>
  </div>
</div>

<script>
const STEMS = ['甲','乙','丙','丁','戊','己','庚','辛','壬','癸'];
const BRANCHES = ['子','丑','寅','卯','辰','巳','午','未','申','酉','戌','亥'];

// 基準日: 2026-08-03 は 己酉(60干支中インデックス45, 甲子=0起点)
const REF_UTC = Date.UTC(2026, 7, 3); // month is 0-indexed
const REF_INDEX = 45;

function kanshiIndex(y, m, d){
  const t = Date.UTC(y, m, d);
  const diffDays = Math.round((t - REF_UTC) / 86400000);
  let idx = (REF_INDEX + diffDays) % 60;
  if (idx < 0) idx += 60;
  return idx;
}
function kanshiStr(y, m, d){
  const idx = kanshiIndex(y, m, d);
  return STEMS[idx % 10] + BRANCHES[idx % 12];
}

const today = new Date();
let viewY = today.getFullYear();
let viewM = today.getMonth();

function render(){
  document.getElementById('ym').innerHTML =
    viewY + '年 ' + (viewM+1) + '月 <span>Reiwa</span>';

  const grid = document.getElementById('grid');
  grid.innerHTML = '';

  const firstDow = new Date(viewY, viewM, 1).getDay();
  const daysInMonth = new Date(viewY, viewM+1, 0).getDate();

  for(let i=0;i<firstDow;i++){
    const c = document.createElement('div');
    c.className = 'cell empty';
    grid.appendChild(c);
  }

  for(let d=1; d<=daysInMonth; d++){
    const dow = new Date(viewY, viewM, d).getDay();
    const c = document.createElement('div');
    c.className = 'cell' + (dow===0?' sun':'') + (dow===6?' sat':'');
    const isToday = (viewY===today.getFullYear() && viewM===today.getMonth() && d===today.getDate());
    if(isToday) c.className += ' today';

    const num = document.createElement('div');
    num.className = 'num';
    num.textContent = d;

    const ks = document.createElement('div');
    ks.className = 'kanshi';
    ks.textContent = kanshiStr(viewY, viewM, d);

    c.appendChild(num);
    c.appendChild(ks);
    if(isToday){
      const stamp = document.createElement('div');
      stamp.className = 'stamp';
      c.appendChild(stamp);
    }
    grid.appendChild(c);
  }

  const detail = document.getElementById('todayDetail');
  const ty = today.getFullYear(), tm = today.getMonth(), td = today.getDate();
  const idx = kanshiIndex(ty, tm, td);
  detail.innerHTML =
    '<div class="label">本日の干支</div>' +
    '<div class="value">' + kanshiStr(ty, tm, td) +
    '<span>60干支中 第' + (idx+1) + '番</span></div>';
}

document.getElementById('prev').onclick = ()=>{
  viewM--; if(viewM<0){viewM=11; viewY--;}
  render();
};
document.getElementById('next').onclick = ()=>{
  viewM++; if(viewM>11){viewM=0; viewY++;}
  render();
};

render();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}
</script>
</body>
</html>
